plugins {
    id 'com.android.application'
}

// Assinatura de release: android/keystore.properties (fora do git) aponta para o .jks
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystoreProps.load(new FileInputStream(keystorePropsFile))

android {
    namespace 'br.com.petday'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.petday'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        // Servidor fixo do app (sem barra no fim). Para testar na rede local:
        //   ./gradlew assembleDebug -PpetdayServer=http://192.168.0.10:8200
        def server = (project.findProperty('petdayServer') ?: 'https://petday.onrender.com').toString().replaceAll('/+$', '')
        buildConfigField 'String', 'SERVER_URL', "\"${server}\""
        // HTTP sem TLS só é liberado quando o servidor configurado é http:// (teste local)
        manifestPlaceholders = [cleartext: server.startsWith('http://').toString()]
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
